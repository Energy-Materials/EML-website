<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>EML Admin Dashboard</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <a class="skip-link" href="#admin-main">본문으로 건너뛰기</a>
  <header class="admin-topbar">
    <div class="admin-brand">
      <img src="assets/eml-logo-white.svg" alt="EML" data-admin-logo />
      <div>
        <strong>EML Admin</strong>
        <span>Website content dashboard</span>
      </div>
    </div>
    <nav class="top-actions" aria-label="관리자 작업" data-admin-actions hidden>
      <span class="cloud-state" role="status" aria-live="polite" data-local-state>Git 연결 확인 중</span>
      <span class="admin-user" data-admin-user></span>
      <button class="top-save" type="button" data-top-save disabled>Save Changes</button>
      <a href="index.html#home" target="_blank" rel="noreferrer" data-preview-site>Preview Site</a>
      <button type="button" data-export>Export JSON</button>
      <button type="button" data-import-trigger>Import JSON</button>
      <input type="file" accept="application/json" data-import hidden />
      <button type="button" data-reset>Load Starter Data</button>
      <button type="button" data-logout hidden>Logout</button>
    </nav>
  </header>

  <div class="admin-auth-shell" data-auth-shell>
    <section class="auth-card">
      <img src="assets/eml-logo-dark.svg" alt="EML" />
      <div data-auth-loading>
        <h1>콘텐츠 저장소 연결 중</h1>
        <p>Git 기반 홈페이지 데이터와 관리자 인증 상태를 확인하고 있습니다.</p>
      </div>
      <div data-login-panel hidden>
        <h1>관리자 인증이 필요합니다</h1>
        <p>허용된 GitHub 계정으로 로그인하면 홈페이지 콘텐츠를 편집하고 Git 저장소에 반영할 수 있습니다.</p>
        <p class="auth-message" role="status" aria-live="polite" data-login-message hidden></p>
        <a class="primary auth-submit" href="/api/auth/login">GitHub로 관리자 로그인</a>
      </div>
      <div data-auth-error hidden>
        <h1>관리자 페이지를 열 수 없습니다</h1>
        <p data-auth-error-message></p>
        <button class="secondary" type="button" data-auth-retry>다시 시도</button>
      </div>
    </section>
  </div>

  <main class="admin-layout" id="admin-main" tabindex="-1" data-admin-app hidden>
    <aside class="admin-sidebar" aria-label="편집 섹션" data-sidebar>
      <button class="is-active" type="button" aria-current="page" data-section="dashboard">Dashboard</button>
      <button type="button" data-section="brand">Brand & Assets</button>
      <button type="button" data-section="banners">Subpage Banners</button>
      <button type="button" data-section="site">Contact / Footer</button>
      <button type="button" data-section="home">Home</button>
      <button type="button" data-section="research">Research</button>
      <button type="button" data-section="professor">Professor</button>
      <button type="button" data-section="members">Members</button>
      <button type="button" data-section="alumni">Alumni</button>
      <button type="button" data-section="publications">Publications</button>
      <button type="button" data-section="gallery">Gallery</button>
      <button type="button" data-section="raw">Raw JSON</button>
    </aside>
    <section class="admin-main">
      <div class="notice">
        <strong data-local-heading>Git 홈페이지 콘텐츠 관리</strong>
        <p data-local-detail>저장하면 홈페이지 데이터 파일이 갱신되고 자동 배포가 시작됩니다.</p>
        <div class="notice-actions">
          <button class="secondary" type="button" data-reload-content>저장소 최신 내용 다시 불러오기</button>
          <button class="secondary" type="button" data-import-legacy hidden>기존 브라우저 초안 가져오기</button>
          <button class="secondary" type="button" data-export-session-draft hidden>충돌 초안 JSON 다운로드</button>
        </div>
      </div>
      <div data-admin-content></div>
    </section>
  </main>

  <script src="data/site-data.js"></script>
  <script src="data-validation.js"></script>
  <script src="local-content-store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
