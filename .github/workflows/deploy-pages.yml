name: Validate EML website for Cloudflare Workers

on:
  push:
    branches:
      - develop
    paths:
      - "eml_website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - "eml_website/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  group: eml-website-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eml_website
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate canonical content and assets
        run: npm run check

      - name: Validate local admin server contract
        run: npm run admin -- --check

      - name: Validate Worker and API module syntax
        shell: bash
        run: |
          node --check worker.js
          find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test Worker routing, security, and Git publishing contracts
        run: npm test

      - name: Build deterministic Cloudflare output
        run: npm run build

      - name: Verify public artifact boundaries
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/admin.html
          test -f dist/local-content-store.js
          test -f dist/data/site-data.js
          test -f dist/_headers
          grep -F "img-src 'self' data: blob:" dist/_headers
          grep -F "X-Robots-Tag: noindex, nofollow, noarchive" dist/_headers
          test ! -e dist/tools
          test ! -e dist/tests
          test ! -e dist/functions
          test ! -e dist/supabase-config.js
          test ! -e dist/cloud-data.js

      - name: Compile Worker and static-assets configuration
        run: npx --yes wrangler@4.127.0 deploy --dry-run
