name: Deploy EML website to GitHub Pages

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out develop
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Verify static site files
        shell: bash
        run: |
          test -f eml_website/index.html
          test -f eml_website/admin.html
          test -f eml_website/styles.css
          test -f eml_website/app.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: eml_website

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
